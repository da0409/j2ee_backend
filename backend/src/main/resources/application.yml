server:
  port: 8080

spring:
  application:
    name: campus-activity-backend

  main:
    # 请求路径不存在时抛出 NoHandlerFoundException，由 GlobalExceptionHandler 统一返回 {code:404,...}
    throw-exception-if-no-handler-found: true

  # MySQL 连接配置（规范文档 3.1：MySQL 8.x）
  # 请按本地环境修改 username / password，或使用环境变量 DB_USERNAME / DB_PASSWORD 覆盖
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_activity?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jackson:
    # 统一时间格式：yyyy-MM-dd'T'HH:mm:ss（规范文档 5.4）
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: Asia/Shanghai
    # 空值不返回 null 之外的额外处理，保持 null 语义（规范文档 5.5）
    default-property-inclusion: always

  # 静态资源目录（活动图片，规范文档 3.3：image 只存 URL）
  web:
    resources:
      static-locations: classpath:/static/

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.campus.user.entity,com.campus.activity.entity
  configuration:
    map-underscore-to-camel-case: true

# 业务自定义配置
app:
  jwt:
    # 生产环境务必替换为随机字符串，长度不少于 32 字节
    secret: ${JWT_SECRET:campus-activity-platform-jwt-secret-key-please-change-me-2026}
    expiration-hours: 24
  cors:
    # 前端开发服务器地址，多个用逗号分隔
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173}
  security:
    # 无需登录即可访问的接口（规范文档 4.2 中未标注 Authorization 的接口）
    public-paths: >-
      /api/auth/**,
      /api/activities,
      /api/activities/*,
      /api/activities/categories,
      /api/activities/*/participants/count,
      /error

logging:
  level:
    com.campus: debug
